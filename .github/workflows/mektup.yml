name: Mektup formula

on:
  push:
    paths:
      - Formula/mektup.rb
      - .github/workflows/mektup.yml
  pull_request:
    paths:
      - Formula/mektup.rb
      - .github/workflows/mektup.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: install (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-14
          - ubuntu-24.04

    steps:
      - name: Set up Homebrew and this tap
        id: homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          core: true
          stable: true

      - name: Install Mektup from the checked-out formula
        run: brew install --build-from-source "${{ steps.homebrew.outputs.tap-name }}/mektup"

      - name: Exercise the installed formula
        run: brew test "${{ steps.homebrew.outputs.tap-name }}/mektup"
